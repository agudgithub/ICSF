# .github/workflows/ci.yml
name: Node.js CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
        env:
            CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
            CYPRESS_USER_PASSWORD: ${{ secrets.CYPRESS_USER_PASSWORD }}






      


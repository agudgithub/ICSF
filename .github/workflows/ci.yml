name: CI Pipeline

on:
  push:
    branches: [main, develop] # Por ahora, para probar

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v3

      - name: 2. Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Usa una versión LTS de Node.js
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm install

      - name: 4. Lint code
        run: npm run lint
      
      - name: 7. Check Formatting (Task 3.d)
        run: npm run format:check
        
      - name: 5. Run Unit Tests (Task 3.a)
        run: npm test

      - name: 6. Run Integration Tests with Cypress (Task 3.b)
        run: npx cypress run


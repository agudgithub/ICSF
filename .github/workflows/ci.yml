name: CI Pipeline
on:
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v3

      - name: 2. Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Usa una versión LTS de Node.js
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm install # Instala todas las dependencias del proyecto definidas en package.json.

      - name: 4. Lint code
        run: npm run lint # Ejecuta el linter (ESLint) para verificar que el código cumple con las reglas de estilo y calidad.

      - name: 7. Check Formatting (Task 3.d)
        run: npm run format:check # Verifica que el formato del código (Prettier) sea el correcto.

      - name: 5. Run Unit Tests (Task 3.a)
        run: npm test # Ejecuta las pruebas unitarias y de integración con Jest.

      - name: 6. Run Integration Tests with Cypress (Task 3.b)
        run: npx cypress run

        env:
          CYPRESS_USER_EMAIL: ${{ secrets.CYPRESS_USER_EMAIL }}
          CYPRESS_USER_PASSWORD:
            ${{ secrets.CYPRESS_USER_PASSWORD }}
            # Ejecuta las pruebas de end-to-end con Cypress, usando las credenciales guardadas como secrets.
